<div class="p-6 sm:p-7 space-y-6">
  <!-- Encabezado del Modal -->
  <div class="border-b border-slate-100 pb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-600 to-emerald-500 text-white flex items-center justify-center font-bold text-sm shadow-md">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 21h18M3 7v1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7H3l2-4h14l2 4M5 21V10.85M19 21V10.85M9 21v-4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4"></path>
        </svg>
      </div>
      <div>
        <h3 class="text-base sm:text-lg font-extrabold text-slate-900 tracking-tight">
          {{ sucursalParaEditar() ? 'Modificar Punto de Venta' : 'Alta de Nuevo Punto de Venta' }}
        </h3>
        <p class="text-xs text-slate-500 mt-0.5">
          Configuración de sede en la red comercial y satélite farmacéutica.
        </p>
      </div>
    </div>
  </div>

  <!-- Banner de Error -->
  @if (errorMensaje()) {
    <div class="p-3.5 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl text-xs flex items-center gap-2">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0 text-rose-600">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMensaje() }}</span>
    </div>
  }

  <!-- Formulario en 2 Columnas -->
  <form (ngSubmit)="guardar()" class="space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Nombre Oficial -->
      <div class="sm:col-span-2">
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Nombre Oficial de la Sede / Stand *
        </label>
        <input
          type="text"
          [(ngModel)]="nombre"
          name="nombre"
          required
          placeholder="Ej. Sucursal C.C. Las Américas (Isla Nivel 2)"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none"
        />
      </div>

      <!-- Tipo de Punto de Venta -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Tipo de Infraestructura *
        </label>
        <select
          [(ngModel)]="tipoSucursal"
          name="tipoSucursal"
          required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none font-semibold text-slate-800"
        >
          <option value="MALL_STAND">🛍️ Centro Comercial (Isla / Local)</option>
          <option value="GAS_STAND">⛽ Stand Express en Gasolinera (24/7)</option>
          <option value="FARMACIA">🏥 Farmacia Central / Bodega Matriz</option>
          <option value="BODEGA_MATRIZ">📦 Bodega Matriz Mayorista</option>
        </select>
      </div>

      <!-- Estado Operativo -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Estado Operativo *
        </label>
        <select
          [(ngModel)]="estado"
          name="estado"
          required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none font-semibold text-slate-800"
        >
          <option value="ACTIVA">🟢 Activa (Operando)</option>
          <option value="MANTENIMIENTO">🟡 En Remodelación / Mantenimiento</option>
          <option value="INACTIVA">⚪ Inactiva (Cerrada temporalmente)</option>
        </select>
      </div>

      <!-- Departamento -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Departamento de Guatemala *
        </label>
        <select
          [(ngModel)]="departamentoId"
          (ngModelChange)="onDepartamentoChange()"
          name="departamentoId"
          required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none font-semibold text-slate-800"
        >
          @for (dep of departamentos(); track dep.departamentoId) {
            <option [ngValue]="dep.departamentoId">{{ dep.nombre }}</option>
          }
        </select>
      </div>

      <!-- Municipio -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Municipio *
        </label>
        <select
          [(ngModel)]="municipioId"
          name="municipioId"
          required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none font-semibold text-slate-800"
        >
          @for (mun of municipios(); track mun.municipioId) {
            <option [ngValue]="mun.municipioId">{{ mun.nombre }}</option>
          }
        </select>
      </div>

      <!-- Dirección Física -->
      <div class="sm:col-span-2">
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Dirección Física Exacta *
        </label>
        <input
          type="text"
          [(ngModel)]="direccion"
          name="direccion"
          required
          placeholder="Ej. Centro Comercial Miraflores, Kiosko K-104, Zona 11"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none"
        />
      </div>

      <!-- Teléfono -->
      <div class="sm:col-span-2">
        <label class="block text-xs font-bold text-slate-700 mb-1">
          Teléfono / PBX de Atención (Opcional)
        </label>
        <input
          type="text"
          [(ngModel)]="telefono"
          name="telefono"
          placeholder="Ej. 2470-1122"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none font-mono"
        />
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
      <button
        type="button"
        (click)="cerrar.emit()"
        class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="guardando()"
        class="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-slate-900 hover:bg-slate-800 disabled:opacity-50 transition-all flex items-center gap-2 cursor-pointer shadow-md shadow-slate-900/10"
      >
        @if (guardando()) {
          <span class="inline-block w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        }
        <span>{{ sucursalParaEditar() ? 'Guardar Cambios' : 'Registrar Sede' }}</span>
      </button>
    </div>
  </form>
</div>
