<div class="bg-white rounded-lg shadow p-6 max-w-md">
  <h2 class="font-medium text-slate-800 mb-3">Perfil (GET /auth/perfil)</h2>

  @if (cargando()) {
    <p class="text-sm text-slate-500">Cargando…</p>
  } @else if (error()) {
    <p class="text-sm text-red-600">{{ error() }}</p>
  } @else if (perfil(); as p) {
    <dl class="text-sm text-slate-600 space-y-1">
      <div><dt class="inline font-medium">Usuario:</dt> <dd class="inline">{{ p.username }}</dd></div>
      <div><dt class="inline font-medium">Rol:</dt> <dd class="inline">{{ p.rolNombre }}</dd></div>
      <div><dt class="inline font-medium">Credencial ID:</dt> <dd class="inline">{{ p.credencialId }}</dd></div>
      <div><dt class="inline font-medium">Empleado ID:</dt> <dd class="inline">{{ p.empleadoId }}</dd></div>
    </dl>
  }
</div>
