<div class="p-6">
  <h2 class="text-lg font-semibold text-slate-800 mb-4">
    {{ modoEdicion() ? 'Editar producto' : 'Nuevo producto' }}
  </h2>

  @if (cargando()) {
    <p class="text-sm text-slate-500">Cargando…</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
        <input
          type="text"
          formControlName="nombre"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Código de producto</label>
        <input
          type="text"
          formControlName="codigoProducto"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Precio de venta</label>
          <input
            type="number"
            step="0.01"
            formControlName="precioVenta"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">% IVA</label>
          <input
            type="number"
            step="0.01"
            formControlName="porcentajeIva"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
          />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Principio activo</label>
        <input
          type="text"
          formControlName="principioActivo"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Presentación</label>
          <input
            type="text"
            formControlName="presentacion"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Concentración</label>
          <input
            type="text"
            formControlName="concentracion"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
          />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Categoría</label>
          <select formControlName="categoriaId" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
            <option [ngValue]="null">— Sin categoría —</option>
            @for (c of categorias(); track c.categoriaId) {
              <option [ngValue]="c.categoriaId">{{ c.nombre }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Laboratorio</label>
          <select formControlName="laboratorioId" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
            <option [ngValue]="null">— Sin laboratorio —</option>
            @for (l of laboratorios(); track l.laboratorioId) {
              <option [ngValue]="l.laboratorioId">{{ l.nombre }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Unidad de medida</label>
        <select formControlName="unidadMedidaId" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          <option [ngValue]="null">— Sin unidad de medida —</option>
          @for (u of unidadesMedida(); track u.unidadMedidaId) {
            <option [ngValue]="u.unidadMedidaId">{{ u.nombre }} ({{ u.abreviatura }})</option>
          }
        </select>
      </div>

      <label class="flex items-center gap-2 text-sm text-slate-700">
        <input type="checkbox" formControlName="requiereReceta" class="rounded border-slate-300" />
        Requiere receta
      </label>

      @if (error()) {
        <p class="text-sm text-red-600">{{ error() }}</p>
      }

      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          (click)="cancelado.emit()"
          class="rounded-md px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="guardando()"
          class="rounded-md bg-sky-600 text-white text-sm font-medium px-4 py-2 hover:bg-sky-700 disabled:opacity-60"
        >
          {{ guardando() ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </form>
  }
</div>
