<div
  class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-sky-950">
  <!-- Círculos decorativos de luz difuminada -->
  <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-sky-500/15 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-emerald-500/15 blur-3xl pointer-events-none">
  </div>
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full bg-sky-600/10 blur-[120px] pointer-events-none">
  </div>

  <div class="w-full max-w-md relative z-10">
    <!-- Tarjeta de Login -->
    <div
      class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl shadow-slate-950/50 border border-white/20 p-8 sm:p-9 space-y-6">
      <!-- Logo y Encabezado -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center p-2 mb-1">
          <img src="assets/images/logo-prosalud.png" alt="Logo Farmacia ProSalud"
            class="w-20 h-20 object-contain drop-shadow-md hover:scale-105 transition-transform" />
        </div>
        <h1 class="text-2xl font-black tracking-tight">
          <span class="text-[#273b84]">Farmacia </span><span class="text-[#83c141]">ProSalud</span>
        </h1>
      </div>

      <!-- Formulario -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Campo Usuario -->
        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">
            Usuario del Sistema
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input id="username" type="text" formControlName="username" autocomplete="username"
              placeholder="Ingresa tu usuario"
              class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/25 focus:border-sky-500 transition-all text-slate-800 placeholder:text-slate-400" />
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">
            Contraseña
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input id="password" [type]="mostrarPassword() ? 'text' : 'password'" formControlName="password"
              autocomplete="current-password" placeholder="Ingresa tu clave de acceso"
              class="w-full pl-10 pr-10 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/25 focus:border-sky-500 transition-all text-slate-800 placeholder:text-slate-400" />
            <button type="button" (click)="alternarPassword()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer"
              title="Mostrar / ocultar contraseña">
              @if (mostrarPassword()) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              }
            </button>
          </div>
        </div>

        <!-- Banner de Error -->
        @if (error()) {
        <div
          class="p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 flex items-center gap-2 animate-shake">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            class="shrink-0">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ error() }}</span>
        </div>
        }

        <!-- Botón de Ingreso -->
        <button type="submit" [disabled]="cargando()"
          class="w-full rounded-xl bg-gradient-to-r from-sky-600 to-sky-700 hover:from-sky-500 hover:to-sky-600 text-white text-sm font-semibold py-3 shadow-lg shadow-sky-600/30 active:scale-98 disabled:opacity-60 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2 cursor-pointer mt-2">
          @if (cargando()) {
          <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span>Verificando credenciales…</span>
          } @else {
          <span>Iniciar Sesion</span>

          }
        </button>
      </form>
    </div>

    <!-- Pie de página de seguridad -->
    <div class="text-center mt-5 text-xs text-slate-400/80 flex items-center justify-center gap-2">
    </div>
  </div>
</div>
