<div class="p-6 sm:p-7 space-y-6">
  <!-- Header Modal -->
  <div class="flex items-start justify-between border-b border-slate-100 pb-4">
    <div class="flex items-center space-x-3">
      <div
        class="flex h-11 w-11 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600 ring-1 ring-emerald-500/20">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        </svg>
      </div>
      <div>
        <h3 class="text-lg font-bold text-slate-800">Alta de Activo Fijo e Infraestructura</h3>
        <p class="text-xs text-slate-500">Incorporación patrimonial al inventario corporativo y balance contable</p>
      </div>
    </div>
    <button (click)="cancelar.emit()" type="button"
      class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition">
    </button>
  </div>

  <!-- Alert Error -->
  @if (error()) {
  <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700 flex items-start space-x-2">
    <svg class="h-5 w-5 text-red-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>{{ error() }}</span>
  </div>
  }

  <!-- Form Grid -->
  <form (ngSubmit)="submit()" class="space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Código Activo -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Código Único de Activo *
        </label>
        <input type="text" [(ngModel)]="form.codigoActivo" name="codigoActivo" placeholder="Ej. ACT-FR-012" required
          class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm font-mono uppercase text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none" />
      </div>

      <!-- Categoría -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Categoría Contable / Vida Útil *
        </label>
        <select [(ngModel)]="form.categoriaActivoId" name="categoriaActivoId" required
          class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none bg-white">
          <option [ngValue]="0" disabled>Seleccione categoría...</option>
          @for (cat of categorias; track cat.categoriaActivoId) {
          <option [ngValue]="cat.categoriaActivoId">
            {{ cat.nombre }} ({{ cat.vidaUtilMeses }} meses / {{ cat.vidaUtilMeses / 12 }} años)
          </option>
          }
        </select>
      </div>
    </div>

    <!-- Descripción -->
    <div>
      <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
        Descripción del Equipo o Activo *
      </label>
      <input type="text" [(ngModel)]="form.descripcion" name="descripcion"
        placeholder="Ej. Refrigerador Clínico de Vacunas con Monitoreo Térmico Digital" required
        class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none" />
    </div>

    <!-- Sucursal Asignada -->
    <div>
      <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
        Sucursal Asignada (Ubicación Física) *
      </label>
      @if (esAdmin()) {
      <select [(ngModel)]="form.sucursalId" name="sucursalId" required
        class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none bg-white">
        <option [ngValue]="0" disabled>Seleccione sucursal...</option>
        @for (suc of sucursales; track suc.sucursalId) {
        <option [ngValue]="suc.sucursalId">
          {{ suc.nombre }} ({{ suc.tipoSucursal || 'SUCURSAL' }})
        </option>
        }
      </select>
      } @else {
      <div
        class="flex items-center justify-between rounded-xl border border-indigo-100 bg-indigo-50/60 px-3.5 py-2.5 text-sm text-indigo-900 shadow-xs">
        <div class="flex items-center space-x-2.5 truncate">
          <svg class="h-4 w-4 text-indigo-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span class="font-medium text-indigo-950 truncate">
            {{ usuarioActual()?.sucursalNombre || 'Mi Sucursal Asignada' }}
          </span>
        </div>
        <span class="text-[11px] font-semibold text-indigo-700 bg-indigo-100/80 px-2 py-0.5 rounded-md shrink-0">
          Tu Sede
        </span>
      </div>
      }
    </div>

    <!-- Marca, Modelo, Serie -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Marca
        </label>
        <input type="text" [(ngModel)]="form.marca" name="marca" placeholder="Ej. Liebherr / Elo"
          class="w-full rounded-xl border border-slate-200 px-3.5 py-2 text-sm text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Modelo
        </label>
        <input type="text" [(ngModel)]="form.modelo" name="modelo" placeholder="Ej. MedLine 3910"
          class="w-full rounded-xl border border-slate-200 px-3.5 py-2 text-sm text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Número de Serie
        </label>
        <input type="text" [(ngModel)]="form.numeroSerie" name="numeroSerie" placeholder="Ej. SN-998273"
          class="w-full rounded-xl border border-slate-200 px-3.5 py-2 text-sm font-mono text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none" />
      </div>
    </div>

    <!-- Valores Financieros y Fecha -->
    <div class="rounded-xl bg-slate-50 border border-slate-200/80 p-4 space-y-3">
      <div class="flex items-center space-x-2 text-xs font-bold text-slate-700 uppercase tracking-wide">
        <svg class="h-4 w-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Parámetros Contables y de Depreciación</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">
            Fecha de Adquisición *
          </label>
          <input type="date" [(ngModel)]="form.fechaAdquisicion" name="fechaAdquisicion" required
            class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">
            Costo de Adquisición (Q) *
          </label>
          <input type="number" step="0.01" min="0" [(ngModel)]="form.valorAdquisicion" name="valorAdquisicion"
            placeholder="0.00" required
            class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">
            Valor Residual / Rescate (Q)
          </label>
          <input type="number" step="0.01" min="0" [(ngModel)]="form.valorResidual" name="valorResidual"
            placeholder="0.00"
            class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none" />
        </div>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-100">
      <button type="button" (click)="cancelar.emit()" [disabled]="guardando()"
        class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
        Cancelar
      </button>
      <button type="submit" [disabled]="guardando()"
        class="inline-flex items-center space-x-2 rounded-xl bg-emerald-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 disabled:opacity-50 transition">
        @if (guardando()) {
        <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        <span>Registrando...</span>
        } @else {
        <span>Incorporar Activo</span>
        }
      </button>
    </div>
  </form>
</div>
