<div class="p-6 sm:p-7 space-y-6">
  <!-- Header Modal -->
  <div class="flex items-start justify-between border-b border-slate-100 pb-4">
    <div class="flex items-center space-x-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-amber-50 text-amber-600 ring-1 ring-amber-500/20">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <div>
        <h3 class="text-lg font-bold text-slate-800">Actualizar Estado Operativo / Mantenimiento</h3>
        <p class="text-xs text-slate-500">Gestión de disponibilidad técnica y bajas de activos patrimoniales</p>
      </div>
    </div>
    <button
      (click)="cancelar.emit()"
      type="button"
      class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Ficha Rápida del Activo -->
  <div class="rounded-xl bg-slate-50 border border-slate-200/70 p-4">
    <div class="flex items-center space-x-2 mb-1">
      <span class="rounded bg-slate-200 px-2 py-0.5 font-mono text-xs font-bold text-slate-800">
        {{ activo.codigoActivo }}
      </span>
      <span class="text-xs text-slate-500">
        {{ activo.sucursal?.nombre || 'Central' }}
      </span>
    </div>
    <h4 class="text-sm font-semibold text-slate-900">{{ activo.descripcion }}</h4>
  </div>

  <!-- Alert Error -->
  @if (error()) {
    <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700 flex items-start space-x-2">
      <svg class="h-5 w-5 text-red-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ error() }}</span>
    </div>
  }

  <!-- Form -->
  <form (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
        Nuevo Estado Operativo *
      </label>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <!-- ACTIVO -->
        <label
          class="flex flex-col items-center justify-center p-3 rounded-xl border-2 cursor-pointer transition text-center"
          [class.border-emerald-500]="nuevoEstado === 'ACTIVO'"
          [class.bg-emerald-50]="nuevoEstado === 'ACTIVO'"
          [class.border-slate-200]="nuevoEstado !== 'ACTIVO'"
        >
          <input
            type="radio"
            name="nuevoEstado"
            value="ACTIVO"
            [(ngModel)]="nuevoEstado"
            class="sr-only"
          />
          <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 mb-1.5"></span>
          <span class="text-xs font-bold text-slate-800">OPERATIVO</span>
          <span class="text-[11px] text-slate-500 mt-0.5">En servicio regular</span>
        </label>

        <!-- EN_MANTENIMIENTO -->
        <label
          class="flex flex-col items-center justify-center p-3 rounded-xl border-2 cursor-pointer transition text-center"
          [class.border-amber-500]="nuevoEstado === 'EN_MANTENIMIENTO'"
          [class.bg-amber-50]="nuevoEstado === 'EN_MANTENIMIENTO'"
          [class.border-slate-200]="nuevoEstado !== 'EN_MANTENIMIENTO'"
        >
          <input
            type="radio"
            name="nuevoEstado"
            value="EN_MANTENIMIENTO"
            [(ngModel)]="nuevoEstado"
            class="sr-only"
          />
          <span class="h-2.5 w-2.5 rounded-full bg-amber-500 mb-1.5"></span>
          <span class="text-xs font-bold text-slate-800">MANTENIMIENTO</span>
          <span class="text-[11px] text-slate-500 mt-0.5">Calibración o taller</span>
        </label>

        <!-- DE_BAJA -->
        <label
          class="flex flex-col items-center justify-center p-3 rounded-xl border-2 cursor-pointer transition text-center"
          [class.border-red-500]="nuevoEstado === 'DE_BAJA'"
          [class.bg-red-50]="nuevoEstado === 'DE_BAJA'"
          [class.border-slate-200]="nuevoEstado !== 'DE_BAJA'"
        >
          <input
            type="radio"
            name="nuevoEstado"
            value="DE_BAJA"
            [(ngModel)]="nuevoEstado"
            class="sr-only"
          />
          <span class="h-2.5 w-2.5 rounded-full bg-red-500 mb-1.5"></span>
          <span class="text-xs font-bold text-slate-800">DE BAJA</span>
          <span class="text-[11px] text-slate-500 mt-0.5">Fin de vida útil</span>
        </label>
      </div>
    </div>

    <!-- Observaciones -->
    <div>
      <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
        Detalle Técnico u Observación
      </label>
      <textarea
        [(ngModel)]="observacion"
        name="observacion"
        rows="3"
        placeholder="Ej. Ingreso a calibración anual de sensor de temperatura Liebherr según protocolo de cadena de frío..."
        class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-800 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition outline-none resize-none"
      ></textarea>
    </div>

    <!-- Botones -->
    <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="cancelar.emit()"
        [disabled]="guardando()"
        class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50 transition"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="guardando()"
        class="inline-flex items-center space-x-2 rounded-xl bg-amber-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-amber-700 disabled:opacity-50 transition"
      >
        @if (guardando()) {
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Guardando...</span>
        } @else {
          <span>Actualizar Estado</span>
        }
      </button>
    </div>
  </form>
</div>
