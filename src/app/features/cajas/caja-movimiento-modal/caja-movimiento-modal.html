<div class="p-6 sm:p-7 space-y-6">
  <!-- Encabezado con padding derecho para la X -->
  <div class="border-b border-slate-100 pb-4 pr-10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-700 flex items-center justify-center border border-indigo-100 shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
      </div>
      <div>
        <h3 class="text-base font-bold text-slate-800 leading-tight">
          Registrar Movimiento de Caja · {{ codigoCaja }}
        </h3>
        <p class="text-xs text-slate-400 mt-0.5">
          Ingreso por venta / cobro de mostrador o egreso para gastos menores y depósitos.
        </p>
      </div>
    </div>
  </div>

  @if (error()) {
    <div class="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl flex items-center gap-2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ error() }}</span>
    </div>
  }

  <form (ngSubmit)="submit()" class="space-y-5">
    <!-- Selector Segmentado: Ingreso vs Egreso -->
    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-slate-700">Naturaleza del Flujo:</label>
      <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl border border-slate-200">
        <button
          type="button"
          (click)="tipoMovimiento = 'INGRESO'"
          class="py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 cursor-pointer"
          [class.bg-white]="tipoMovimiento === 'INGRESO'"
          [class.text-emerald-700]="tipoMovimiento === 'INGRESO'"
          [class.shadow-xs]="tipoMovimiento === 'INGRESO'"
          [class.text-slate-500]="tipoMovimiento !== 'INGRESO'"
        >
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          (+) Ingreso / Entrada
        </button>

        <button
          type="button"
          (click)="tipoMovimiento = 'EGRESO'"
          class="py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 cursor-pointer"
          [class.bg-white]="tipoMovimiento === 'EGRESO'"
          [class.text-red-700]="tipoMovimiento === 'EGRESO'"
          [class.shadow-xs]="tipoMovimiento === 'EGRESO'"
          [class.text-slate-500]="tipoMovimiento !== 'EGRESO'"
        >
          <span class="w-2 h-2 rounded-full bg-red-500"></span>
          (-) Egreso / Salida
        </button>
      </div>
    </div>

    <!-- Monto y Método de Pago -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Monto -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-700">Monto (GTQ):</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-400">Q</span>
          <input
            type="number"
            step="0.01"
            min="0.01"
            [(ngModel)]="monto"
            name="monto"
            placeholder="0.00"
            required
            class="w-full pl-8 pr-4 py-2 text-sm font-bold rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-indigo-500 text-slate-800 shadow-2xs font-mono"
          />
        </div>
      </div>

      <!-- Método de Pago -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-700">Método de Cobro / Pago:</label>
        <select
          [(ngModel)]="metodoPagoId"
          name="metodoPagoId"
          required
          class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-indigo-500 text-slate-800 shadow-2xs"
        >
          @for (m of metodosPago(); track m.metodoPagoId) {
            <option [ngValue]="m.metodoPagoId">
              {{ m.nombre }}
            </option>
          }
        </select>
        <span class="text-[10px] text-slate-400 block">
          * Para arqueos, solo el efectivo físico se contrasta contra el cajón.
        </span>
      </div>
    </div>

    <!-- Concepto / Descripción -->
    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-slate-700">Concepto / Motivo de Auditoría:</label>
      <input
        type="text"
        [(ngModel)]="descripcion"
        name="descripcion"
        placeholder="Ej. Cobro venta receta mostrador / Retiro parcial para depósito bancario"
        required
        class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-indigo-500 text-slate-800 shadow-2xs"
      />

      <!-- Sugerencias rápidas -->
      <div class="flex items-center gap-1.5 pt-1 flex-wrap">
        <span class="text-[10px] text-slate-400 font-medium">Conceptos frecuentes:</span>
        <button
          type="button"
          (click)="setConceptoRapido('Venta mostrador de medicamentos')"
          class="text-[10px] px-2 py-0.5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors cursor-pointer"
        >
          Venta mostrador
        </button>
        <button
          type="button"
          (click)="setConceptoRapido('Pago de delivery motorizado')"
          class="text-[10px] px-2 py-0.5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors cursor-pointer"
        >
          Pago delivery
        </button>
        <button
          type="button"
          (click)="setConceptoRapido('Retiro parcial para depósito bancario')"
          class="text-[10px] px-2 py-0.5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors cursor-pointer"
        >
          Depósito bancario
        </button>
        <button
          type="button"
          (click)="setConceptoRapido('Gasto de caja chica / insumos stand')"
          class="text-[10px] px-2 py-0.5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors cursor-pointer"
        >
          Caja chica stand
        </button>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="cancelado.emit()"
        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl transition-colors cursor-pointer"
      >
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="guardando()"
        class="inline-flex items-center gap-2 px-5 py-2 text-xs font-bold text-white rounded-xl shadow-md transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed hover:scale-[1.01] active:scale-[0.99]"
        [class.bg-emerald-600]="tipoMovimiento === 'INGRESO'"
        [class.hover:bg-emerald-700]="tipoMovimiento === 'INGRESO'"
        [class.shadow-emerald-600/20]="tipoMovimiento === 'INGRESO'"
        [class.bg-red-600]="tipoMovimiento === 'EGRESO'"
        [class.hover:bg-red-700]="tipoMovimiento === 'EGRESO'"
        [class.shadow-red-600/20]="tipoMovimiento === 'EGRESO'"
      >
        @if (guardando()) {
          <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Registrando...
        } @else {
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Confirmar {{ tipoMovimiento === 'INGRESO' ? 'Ingreso' : 'Egreso' }}
        }
      </button>
    </div>
  </form>
</div>
