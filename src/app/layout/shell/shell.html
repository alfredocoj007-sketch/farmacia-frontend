<div class="min-h-screen bg-slate-100">
  <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-6 min-w-0">
      <h1 class="text-lg font-semibold text-slate-800 shrink-0">Farmacia</h1>
      <nav class="hidden sm:flex items-center gap-4 text-sm">
        <a
          routerLink="/dashboard"
          routerLinkActive="text-sky-600 font-medium"
          class="text-slate-600 hover:text-sky-600"
        >
          Dashboard
        </a>
        <a
          routerLink="/productos"
          routerLinkActive="text-sky-600 font-medium"
          class="text-slate-600 hover:text-sky-600"
        >
          Productos
        </a>
        <a
          routerLink="/lotes"
          routerLinkActive="text-sky-600 font-medium"
          class="text-slate-600 hover:text-sky-600"
        >
          Lotes
        </a>
      </nav>
    </div>

    <!-- Desktop: usuario + logout inline -->
    <div class="hidden sm:flex items-center gap-4 shrink-0">
      @if (usuario(); as u) {
        <span class="text-sm text-slate-600">{{ u.nombre }} · {{ u.rol }}</span>
      }
      <button (click)="cerrarSesion()" class="text-sm text-slate-600 hover:text-red-600">
        Cerrar sesión
      </button>
    </div>

    <!-- Mobile: hamburger menu -->
    <div class="sm:hidden relative shrink-0" #menuMovil>
      <button
        (click)="alternarMenuMovil()"
        class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-slate-100"
        aria-label="Abrir menú"
      >
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M2.5 5h15M2.5 10h15M2.5 15h15" stroke-linecap="round" />
        </svg>
      </button>

      @if (menuMovilAbierto()) {
        <div class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-slate-200 py-1 z-50">
          <a
            routerLink="/dashboard"
            routerLinkActive="text-sky-600"
            (click)="cerrarMenuMovil()"
            class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
          >
            Dashboard
          </a>
          <a
            routerLink="/productos"
            routerLinkActive="text-sky-600"
            (click)="cerrarMenuMovil()"
            class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
          >
            Productos
          </a>
          <a
            routerLink="/lotes"
            routerLinkActive="text-sky-600"
            (click)="cerrarMenuMovil()"
            class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
          >
            Lotes
          </a>
          @if (usuario(); as u) {
            <div class="px-4 py-2 text-xs text-slate-400 border-t border-slate-100">{{ u.nombre }} · {{ u.rol }}</div>
          }
          <button
            (click)="cerrarSesion()"
            class="block w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
          >
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </header>

  <main class="p-4 sm:p-6">
    <router-outlet />
  </main>
</div>
