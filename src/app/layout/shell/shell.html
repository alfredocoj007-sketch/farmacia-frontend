<div class="min-h-screen bg-slate-100">
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <h1 class="text-lg font-semibold text-slate-800">Farmacia</h1>
      <nav class="flex items-center gap-4 text-sm">
        <a
          routerLink="/dashboard"
          routerLinkActive="text-sky-600 font-medium"
          class="text-slate-600 hover:text-sky-600"
        >
          Dashboard
        </a>
        <a
          routerLink="/productos"
          routerLinkActive="text-sky-600 font-medium"
          class="text-slate-600 hover:text-sky-600"
        >
          Productos
        </a>
        <a
          routerLink="/lotes"
          routerLinkActive="text-sky-600 font-medium"
          class="text-slate-600 hover:text-sky-600"
        >
          Lotes
        </a>
      </nav>
    </div>

    <div class="flex items-center gap-4">
      @if (usuario(); as u) {
        <span class="text-sm text-slate-600">{{ u.nombre }} · {{ u.rol }}</span>
      }
      <button (click)="cerrarSesion()" class="text-sm text-slate-600 hover:text-red-600">
        Cerrar sesión
      </button>
    </div>
  </header>

  <main class="p-6">
    <router-outlet />
  </main>
</div>
