<div class="modal-backdrop" (click)="onBackdropClick()">
  <div class="modal-card relative w-full {{ maxWidthClass }}" (click)="$event.stopPropagation()">
    <button
      type="button"
      (click)="cerrar.emit()"
      class="no-print print:hidden absolute top-4 right-4 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-full w-8 h-8 flex items-center justify-center transition-colors z-10 cursor-pointer"
      aria-label="Cerrar modal"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <ng-content></ng-content>
  </div>
</div>
